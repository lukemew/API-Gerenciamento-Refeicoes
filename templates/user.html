<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if user %}Editar{% else %}Adicionar{% endif %} Usuário</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container mt-5">
      <h2>{% if user %}Editar{% else %}Adicionar{% endif %} Usuário</h2>
      <form method="post">
        <input
          type="hidden"
          name="user_id"
          value="{{ user.id if user else '' }}"
        />
        <div class="mb-3">
          <label for="name" class="form-label">Nome:</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            value="{{ user.name if user else '' }}"
            required
          />
        </div>
        <div class="mb-3">
          <label for="age" class="form-label">Idade:</label>
          <input
            type="number"
            class="form-control"
            id="age"
            name="age"
            value="{{ user.age if user else '' }}"
            required
          />
        </div>
        <button type="submit" class="btn btn-success">
          {% if user %}Atualizar{% else %}Salvar{% endif %}
        </button>
        <a href="/" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </body>
</html>
